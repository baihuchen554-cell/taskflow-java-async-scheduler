spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:local_taskflow_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 128KB

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  workers: ${SCHEDULER_WORKERS:4}
  poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:1000}
  retry-delay-seconds: ${SCHEDULER_RETRY_DELAY_SECONDS:5}
