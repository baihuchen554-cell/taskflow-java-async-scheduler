services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=taskflow --database=taskflow --execute='SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: taskflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
